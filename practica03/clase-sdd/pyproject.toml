[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temperature-converter"
version = "0.1.0"
description = "Conversor de unidades de temperatura (Celsius, Fahrenheit, Kelvin)"
readme = "spec_manual.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
convert_temperature = "converter:main"
convert-temperature = "converter:main"

[tool.hatch.build.targets.wheel]
only-include = ["converter.py"]
